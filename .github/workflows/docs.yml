name: Documentation Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'

jobs:
  docs-structure:
    name: Documentation Structure Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run documentation structure tests
        run: |
          pytest tests/test_docs/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: docs-test-results
          path: .pytest_cache/

  docs-validation:
    name: Documentation Content Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run documentation verification script
        run: |
          python docs/verify_docs.py

      - name: Check for broken links
        run: |
          echo "Checking for broken documentation references..."
          # Check for old-style paths (docs/technical/, docs/planning/, etc.)
          if grep -r "docs/technical\|docs/testing\|docs/planning\|docs/input\|docs/archive" docs/ --include="*.md" | grep -v "code blocks" | grep -v ".archived"; then
            echo "❌ Found old-style documentation references"
            exit 1
          else
            echo "✅ No old-style documentation references found"
          fi

  quality-gate:
    name: Documentation Quality Gate
    runs-on: ubuntu-latest
    needs: [docs-structure, docs-validation]
    if: always()

    steps:
      - name: Check documentation quality
        run: |
          if [ "${{ needs.docs-structure.result }}" = "failure" ] || [ "${{ needs.docs-validation.result }}" = "failure" ]; then
            echo "❌ Documentation validation failed"
            echo "Please check docs/README.md for maintenance guidelines"
            exit 1
          fi
          echo "✅ All documentation checks passed"

      - name: Comment on PR (if needed)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Documentation validated successfully!'
            })
