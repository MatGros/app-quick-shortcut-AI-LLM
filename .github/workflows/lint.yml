name: Code Quality (Lint & Format)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ --output-format=github

  format:
    name: Black Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Check code formatting
        run: |
          black --check --diff src/ tests/

  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports --show-error-codes
        continue-on-error: true  # Don't block if mypy has issues

  quality-summary:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [lint, format, type-check]
    if: always()

    steps:
      - name: Check quality gate results
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || [ "${{ needs.format.result }}" = "failure" ]; then
            echo "❌ Code quality checks failed"
            exit 1
          fi
          echo "✅ All quality checks passed"
